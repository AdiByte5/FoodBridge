spring.application.name=foodbridge-api
server.port=8080

# ---------------------------------------------------------------------------
# Database - dedicated FoodBridge MySQL instance (isolated from other apps).
# Override with FOODBRIDGE_DB_URL / _USER / _PASS env vars when needed.
# ---------------------------------------------------------------------------
spring.datasource.url=${FOODBRIDGE_DB_URL:jdbc:mysql://127.0.0.1:3307/foodbridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${FOODBRIDGE_DB_USER:foodbridge}
spring.datasource.password=${FOODBRIDGE_DB_PASS:foodbridge123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
foodbridge.jwt.secret=foodbridge-intelligent-food-rescue-allocation-platform-secret-key-2026
foodbridge.jwt.expiration-minutes=720

# Demo data
foodbridge.demo.seed=true
foodbridge.scheduler.expiry-ms=180000

server.error.include-message=always
server.error.include-binding-errors=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
logging.level.org.hibernate.SQL=warn
